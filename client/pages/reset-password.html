<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - ConnectSphere</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>ConnectSphere</h1>
                <p>Create New Password</p>
            </div>

            <form id="resetPasswordForm" class="auth-form">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter new password"
                            required
                        >
                        <button type="button" class="toggle-password" id="togglePassword">
                            <span>Show</span>
                        </button>
                    </div>
                    <small>At least 8 characters with uppercase, lowercase, and numbers</small>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        placeholder="Confirm your password"
                        required
                    >
                    <span class="error-message" id="confirmPasswordError"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                    <span>Reset Password</span>
                    <span class="spinner" id="spinner"></span>
                </button>
            </form>

            <div class="back-to-login">
                <a href="login.html">Back to Login</a>
            </div>

            <div id="toast" class="toast"></div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword?.addEventListener('click', (e) => {
            e.preventDefault();
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePassword.textContent = isPassword ? 'Hide' : 'Show';
        });

        document.getElementById('resetPasswordForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            UIHelper.clearAllErrors();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                UIHelper.showToast('Invalid reset link', 'error');
                return;
            }

            if (!Validator.password(password)) {
                UIHelper.showError('password', 'Password must be 8+ characters with uppercase, lowercase, and numbers');
                return;
            }

            if (password !== confirmPassword) {
                UIHelper.showError('confirmPassword', 'Passwords do not match');
                return;
            }

            try {
                UIHelper.setButtonLoading('submitBtn', true);

                const response = await api.resetPassword(token, password, confirmPassword);

                if (response.success) {
                    UIHelper.showToast('Password reset successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = '/pages/login.html';
                    }, 2000);
                }
            } catch (error) {
                UIHelper.showToast(error.message || 'Failed to reset password', 'error');
            } finally {
                UIHelper.setButtonLoading('submitBtn', false);
            }
        });
    </script>
</body>
</html>
