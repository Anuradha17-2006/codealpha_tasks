<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore - ConnectSphere</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/explore.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <a href="home.html"><h1>ConnectSphere</h1></a>
            </div>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="explore.html" class="active">Explore</a></li>
                <li><a href="messages.html">Messages</a></li>
                <li><a href="notifications.html">Notifications</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <!-- Search Bar -->
        <div class="search-section">
            <div class="search-bar">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search users, posts, hashtags..."
                    class="large-search"
                >
            </div>

            <div class="search-filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="users">Users</button>
                <button class="filter-btn" data-filter="posts">Posts</button>
                <button class="filter-btn" data-filter="hashtags">Hashtags</button>
            </div>
        </div>

        <!-- Trending Section -->
        <div class="trending-section">
            <h2>Trending Now</h2>
            <div id="trendingList" class="trending-grid">
                <div class="loading-skeleton"></div>
            </div>
        </div>

        <!-- Search Results -->
        <div id="searchResults" class="search-results" style="display: none;">
            <h2 id="resultsTitle">Search Results</h2>
            <div id="resultsList" class="results-list">
                <div class="loading-skeleton"></div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/explore.js"></script>
</body>
</html>
