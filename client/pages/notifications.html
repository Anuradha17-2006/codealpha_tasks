<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - ConnectSphere</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/notifications.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <a href="home.html"><h1>ConnectSphere</h1></a>
            </div>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="explore.html">Explore</a></li>
                <li><a href="messages.html">Messages</a></li>
                <li><a href="notifications.html" class="active">Notifications</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="notifications-page">
            <div class="notifications-header">
                <h1>Notifications</h1>
                <div class="notification-filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="follows">Follows</button>
                    <button class="filter-btn" data-filter="likes">Likes</button>
                    <button class="filter-btn" data-filter="comments">Comments</button>
                    <button class="filter-btn" data-filter="mentions">Mentions</button>
                </div>
                <button id="markAllReadBtn" class="btn btn-secondary btn-sm">Mark all as read</button>
            </div>

            <div id="notificationsList" class="notifications-list">
                <div class="loading-skeleton"></div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/notifications.js"></script>
</body>
</html>
