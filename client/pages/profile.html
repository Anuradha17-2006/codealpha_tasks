<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - ConnectSphere</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/profile.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <a href="home.html"><h1>ConnectSphere</h1></a>
            </div>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="explore.html">Explore</a></li>
                <li><a href="messages.html">Messages</a></li>
                <li><a href="notifications.html">Notifications</a></li>
                <li><a href="profile.html" class="active">Profile</a></li>
                <li><button id="logoutBtn" class="btn btn-secondary btn-sm">Logout</button></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <!-- Profile Header -->
        <div class="profile-header">
            <div class="cover-photo" id="coverPhoto" style="background-image: url('https://via.placeholder.com/1200x400')"></div>
            <div class="profile-info">
                <img id="profilePic" src="https://via.placeholder.com/150" alt="Profile" class="profile-pic-large">
                <div class="profile-details">
                    <h1 id="fullName">Loading...</h1>
                    <p id="username" class="username">@loading</p>
                    <p id="bio" class="bio">Loading...</p>
                    <p id="location" class="location">📍 Loading...</p>
                    <div class="profile-stats">
                        <div class="stat">
                            <span class="stat-label">Posts</span>
                            <span class="stat-value" id="postsCount">0</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Followers</span>
                            <span class="stat-value" id="followerCount">0</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Following</span>
                            <span class="stat-value" id="followingCount">0</span>
                        </div>
                    </div>
                    <div class="profile-actions">
                        <button id="editProfileBtn" class="btn btn-primary" style="display: none;">Edit Profile</button>
                        <button id="followBtn" class="btn btn-secondary" style="display: none;">Follow</button>
                        <button id="unfollowBtn" class="btn btn-outline" style="display: none;">Following</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="profile-tabs">
            <button class="tab-btn active" data-tab="posts">Posts</button>
            <button class="tab-btn" data-tab="media">Media</button>
            <button class="tab-btn" data-tab="likes">Likes</button>
            <button class="tab-btn" data-tab="bookmarks" id="bookmarksTab" style="display: none;">Bookmarks</button>
        </div>

        <!-- Tab Content -->
        <div class="tab-content">
            <div id="posts-tab" class="tab-pane active">
                <div id="userPosts" class="posts-list">
                    <div class="loading-skeleton"></div>
                </div>
            </div>
            <div id="media-tab" class="tab-pane">
                <div id="userMedia" class="media-grid">
                    <div class="loading-skeleton"></div>
                </div>
            </div>
            <div id="likes-tab" class="tab-pane">
                <div id="userLikes" class="posts-list">
                    <div class="loading-skeleton"></div>
                </div>
            </div>
            <div id="bookmarks-tab" class="tab-pane">
                <div id="userBookmarks" class="posts-list">
                    <div class="loading-skeleton"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Edit Profile</h2>
            <form id="editProfileForm">
                <div class="form-group">
                    <label>Profile Picture</label>
                    <input type="file" id="editProfilePic" accept="image/*" style="display: block; margin-bottom: 10px;">
                    <small style="color: #999;">Recommended: 400x400px</small>
                </div>
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="editFirstName" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="editLastName" required>
                </div>
                <div class="form-group">
                    <label>Bio</label>
                    <textarea id="editBio" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="editLocation">
                </div>
                <div class="form-group">
                    <label>Website</label>
                    <input type="url" id="editWebsite">
                </div>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/profile.js"></script>
</body>
</html>
