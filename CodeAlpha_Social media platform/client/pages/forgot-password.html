<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ConnectSphere</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>ConnectSphere</h1>
                <p>Reset Your Password</p>
            </div>

            <form id="forgotPasswordForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email"
                        required
                    >
                    <span class="error-message" id="emailError"></span>
                </div>

                <p class="help-text">
                    We'll send you an email with instructions to reset your password.
                </p>

                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                    <span>Send Reset Link</span>
                    <span class="spinner" id="spinner"></span>
                </button>
            </form>

            <div class="auth-links">
                <a href="login.html" class="link-secondary">Back to Login</a>
            </div>

            <div id="toast" class="toast"></div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.getElementById('forgotPasswordForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            UIHelper.clearAllErrors();

            const email = document.getElementById('email').value.trim();

            if (!email || !Validator.email(email)) {
                UIHelper.showError('email', 'Invalid email address');
                return;
            }

            try {
                UIHelper.setButtonLoading('submitBtn', true);

                const response = await api.forgotPassword(email);

                if (response.success) {
                    UIHelper.showToast('Reset link sent to your email!', 'success');
                    setTimeout(() => {
                        window.location.href = '/pages/login.html';
                    }, 2000);
                }
            } catch (error) {
                UIHelper.showToast(error.message || 'Failed to send reset link', 'error');
            } finally {
                UIHelper.setButtonLoading('submitBtn', false);
            }
        });
    </script>
</body>
</html>
