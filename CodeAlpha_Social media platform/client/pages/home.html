<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - ConnectSphere</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/home.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <h1>ConnectSphere</h1>
            </div>
            <ul class="nav-links">
                <li><a href="home.html" class="active">Home</a></li>
                <li><a href="explore.html">Explore</a></li>
                <li><a href="messages.html">Messages</a></li>
                <li><a href="notifications.html">Notifications</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><button id="themeToggle" class="theme-toggle">🌙</button></li>
                <li><button id="logoutBtn" class="btn btn-secondary btn-sm">Logout</button></li>
            </ul>
        </div>
    </nav>

    <div class="container main-container">
        <div class="home-layout">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="user-card">
                    <img id="profilePic" src="https://picsum.photos/100" alt="Profile" class="profile-pic">
                    <h3 id="userName">Loading...</h3>
                    <p id="userUsername">@loading</p>
                    <p id="userBio" class="user-bio">Your bio here</p>
                    <div class="user-stats">
                        <div class="stat">
                            <span class="stat-label">Followers</span>
                            <span class="stat-value" id="followerCount">0</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Following</span>
                            <span class="stat-value" id="followingCount">0</span>
                        </div>
                    </div>
                    <a href="profile.html" class="btn btn-primary btn-block">View Profile</a>
                </div>

                <div class="trending-section">
                    <h3>Trending Now</h3>
                    <div id="trendingTags" class="trending-list">
                        <div class="loading-skeleton"></div>
                    </div>
                </div>
            </aside>

            <!-- Main Feed -->
            <main class="feed">
                <!-- Create Post -->
                <div class="post-creator">
                    <div class="post-creator-header">
                        <img src="https://picsum.photos/48" alt="Profile" class="creator-pic">
                        <textarea 
                            id="postContent" 
                            class="post-input" 
                            placeholder="What's on your mind?"
                            rows="3"
                        ></textarea>
                    </div>
                    <div class="post-creator-footer">
                        <div class="post-actions">
                            <button class="post-action-btn" title="Add image">
                                🖼️ Image
                            </button>
                            <button class="post-action-btn" title="Add poll">
                                📊 Poll
                            </button>
                            <button class="post-action-btn" title="Add emoji">
                                😊 Emoji
                            </button>
                        </div>
                        <select id="postVisibility" class="post-visibility">
                            <option value="public">🌐 Public</option>
                            <option value="followers">👥 Followers Only</option>
                            <option value="private">🔒 Private</option>
                        </select>
                        <button id="postBtn" class="btn btn-primary">Post</button>
                    </div>
                </div>

                <!-- Posts Feed -->
                <div id="postsFeed" class="posts-feed">
                    <div class="loading-skeleton"></div>
                    <div class="loading-skeleton"></div>
                    <div class="loading-skeleton"></div>
                </div>

                <!-- Load More -->
                <div id="loadMore" class="load-more-btn" style="display: none;">
                    <button class="btn btn-secondary">Load More Posts</button>
                </div>
            </main>

            <!-- Right Sidebar - Suggested Users -->
            <aside class="suggestions">
                <div class="suggestions-card">
                    <h3>Suggested For You</h3>
                    <div id="suggestedUsers" class="suggested-list">
                        <div class="loading-skeleton"></div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/home.js"></script>
</body>
</html>
