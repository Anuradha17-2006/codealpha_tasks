version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: connectsphere_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-connectsphere}
      MYSQL_USER: ${DB_USER:-connectsphere}
      MYSQL_PASSWORD: ${DB_PASSWORD:-connectsphere}
    ports:
      - "3306:3306"
    volumes:
      - ./database/mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - connectsphere_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: connectsphere_redis
    ports:
      - "6379:6379"
    volumes:
      - ./database/redis_data:/data
    networks:
      - connectsphere_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 5

  # Node.js Backend
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: connectsphere_backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5000}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-connectsphere}
      DB_USER: ${DB_USER:-connectsphere}
      DB_PASSWORD: ${DB_PASSWORD:-connectsphere}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your_super_secret_refresh_key}
      EMAIL_SERVICE: ${EMAIL_SERVICE:-gmail}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - ./uploads:/app/uploads
    networks:
      - connectsphere_network
    command: npm run dev

  # Frontend (Optional - if using Node for serving)
  frontend:
    image: nginx:alpine
    container_name: connectsphere_frontend
    ports:
      - "3000:80"
    volumes:
      - ./client:/usr/share/nginx/html
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - connectsphere_network

networks:
  connectsphere_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
